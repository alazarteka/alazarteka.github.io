# Site settings
title: Alazar Teka Gemechu
description: Personal site
url: https://alazarteka.github.io
baseurl: ""  # Empty for username.github.io sites

# Build settings
markdown: kramdown
highlighter: rouge

# Kramdown configuration
kramdown:
  input: GFM  # GitHub Flavored Markdown
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text

# Blog permalinks
permalink: /blog/:year/:title/

# Include directories
include: ["_pages"]

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/

# Keep these files during build
keep_files:
  - CNAME
  - .nojekyll

# Minimal plugins
plugins:
  - jekyll-feed

# Feed configuration
feed:
  path: feed.xml
